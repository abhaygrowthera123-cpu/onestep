<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background elements -->
  <circle cx="50" cy="50" r="40" fill="url(#grad-secondary)" opacity="0.15" />

  <!-- Outer Ring with gap -->
  <path d="M 50 10 A 40 40 0 1 1 10 50" stroke="url(#grad-primary)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  
  <!-- Dynamic Arrows representing "One Step" forward and up -->
  <!-- Back arrow (subtle, dark blue) -->
  <path d="M30 65 L48 47 L66 65" stroke="url(#grad-secondary)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  
  <!-- Front arrow (bright blue, glowing) -->
  <path d="M38 52 L50 40 L62 52" stroke="url(#grad-primary)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Topmost indicator -->
  <circle cx="50" cy="28" r="5" fill="#ffffff" />
</svg>
